[package]
name = "dqd-sqlrender"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native Rust port of OHDSI SqlRender 1.19.7 render, split, and SQLite/PostgreSQL translation"
readme = "README.md"
keywords = ["sql", "ohdsi", "omop", "sqlrender", "translation"]
categories = ["database", "parser-implementations"]
# The oracle test reads fixtures from the repository root (outside this crate); the fuzz crate is separate.
exclude = ["/fuzz", "/tests/oracle.rs"]

[dependencies]
regex = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
