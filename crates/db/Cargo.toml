[package]
name = "dqd-db"
version = "2.9.0"
edition = "2024"
license = "Apache-2.0"
description = "Native SQLite and PostgreSQL connections reproducing DatabaseConnector behavior for DQD"

[dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
dqd-sqlrender = { path = "../sqlrender" }
# rusqlite 0.37 bundles SQLite 3.50.2, the closest crates.io release to sqlite-jdbc 3.50.3.0's SQLite 3.50.3.
rusqlite = { version = "=0.37.0", features = ["bundled"] }
# duckdb 1.20000.2 binds DuckDB 2.0.0, the engine of the R `duckdb` package DatabaseConnector 8.0.0
# uses. `download-lib` links DuckDB's official prebuilt 2.0.0 library (duckdb.dll, staged next to the
# build outputs) instead of compiling the C++ engine (`bundled`), which needs several GB of disk.
# `.cargo/config.toml` sets DUCKDB_DOWNLOAD_LIB=1.
duckdb = { version = "=1.20000.2", features = ["download-lib"] }
postgres = "0.19"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
# PostgreSQL TLS (feature `tls`): pure Rust, no system OpenSSL.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }

[features]
default = ["tls"]
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots"]
