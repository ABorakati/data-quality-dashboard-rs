name: Release

# Runs when a version tag such as v0.1.0 is pushed. It builds the dqd binary for three platforms, bundles
# DuckDB's shared library next to it, and creates a GitHub release. It does not publish to crates.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # build.rs adds RUNPATH $ORIGIN, so the binary finds libduckdb.so beside itself.
          - os: macos-latest
            target: aarch64-apple-darwin
            # build.rs adds an @loader_path rpath for libduckdb.dylib. UNVERIFIED on macOS: check
            # with `otool -l dqd | grep -A2 LC_RPATH` on the first release.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # duckdb.dll is delay-loaded (build.rs) and found next to dqd.exe.
    steps:
      - name: Keep committed line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No build cache on Windows: see ci.yml (a restored cache loses duckdb.lib and linking fails).
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'
        with:
          key: ${{ matrix.target }}

      - name: Build dqd (default features)
        run: cargo build --locked --release --target ${{ matrix.target }} --bin dqd

      - name: Stage the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="dqd-${GITHUB_REF_NAME}-${TARGET}"
          out="dist/${name}"
          rm -rf dist && mkdir -p "$out"

          bin="target/${TARGET}/release/dqd"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="${bin}.exe"; fi
          cp "$bin" "$out/"

          # DuckDB's prebuilt shared library. libduckdb-sys (`download-lib`, see .cargo/config.toml) stages
          # it in the target profile directory. If it is not there, search the download cache.
          # UNVERIFIED: the staging location and file names come from the libduckdb-sys build script, not
          # from a run of this workflow. The step fails if nothing is found, so a wrong guess shows up as a
          # failed release rather than a broken archive.
          case "$RUNNER_OS" in
            Linux)   patterns=('libduckdb.so*') ;;
            macOS)   patterns=('libduckdb*.dylib') ;;
            Windows) patterns=('duckdb.dll') ;;
          esac
          copied=0
          for pattern in "${patterns[@]}"; do
            hits=$(find "target/${TARGET}/release" -maxdepth 1 -name "$pattern" || true)
            if [ -z "$hits" ]; then
              hits=$(find target -path '*duckdb-download*' -name "$pattern" || true)
            fi
            while IFS= read -r lib; do
              [ -n "$lib" ] || continue
              cp -L "$lib" "$out/"    # -L: copy the file a symlink points to
              copied=$((copied + 1))
            done <<< "$hits"
          done
          if [ "$copied" -eq 0 ]; then
            echo "::error::DuckDB shared library not found for $TARGET"
            exit 1
          fi

          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$out/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -rf "$out"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dqd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only this job may write to the repository, to create the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum dqd-*.tar.gz dqd-*.zip > SHA256SUMS
      - name: Create the release
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS
