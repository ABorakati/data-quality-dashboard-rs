name: Release

# Runs when a version tag such as v0.1.0 is pushed. It builds the dqd binary for three platforms, bundles
# DuckDB's shared library next to it, and creates a GitHub release. It does not publish to crates.io.
#
# Run it by hand (Actions, Release, Run workflow) with `publish_tag` empty for a dry run: the same builds, archives
# and smoke tests, with no release created. Zenodo archives a published release and mints a permanent DOI, so
# check a dry run first. Give `publish_tag` (for example v0.1.0, matching Cargo.toml) to create that tag at the
# commit the workflow runs on and publish the release, which is the same as pushing the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Tag to create and publish, for example v0.1.0. Leave empty for a dry run."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # The release tag: the pushed tag, or publish_tag for a manual publish, else the branch name (dry run).
      RELEASE_TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.publish_tag || github.ref_name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # build.rs adds RUNPATH $ORIGIN, so the binary finds libduckdb.so beside itself.
          - os: macos-latest
            target: aarch64-apple-darwin
            # build.rs adds an @loader_path rpath for libduckdb.dylib. UNVERIFIED on macOS: check
            # with `otool -l dqd | grep -A2 LC_RPATH` on the first release.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # duckdb.dll is delay-loaded (build.rs) and found next to dqd.exe.
    steps:
      - name: Keep committed line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag' || inputs.publish_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a version tag such as v0.1.0"
            exit 1
          fi
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # No build cache: release archives are built from scratch. A restored cache keeps the build output but not
      # the DuckDB library that libduckdb-sys downloaded, so cargo sees dqd as built, never relinks, and the
      # staging step cannot find the library (this failed the first publish).

      - name: Build dqd (default features)
        run: cargo build --locked --release --target ${{ matrix.target }} --bin dqd

      - name: Stage the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="dqd-${RELEASE_TAG}-${TARGET}"
          out="dist/${name}"
          rm -rf dist && mkdir -p "$out"

          bin="target/${TARGET}/release/dqd"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="${bin}.exe"; fi
          cp "$bin" "$out/"

          # DuckDB's prebuilt shared library. libduckdb-sys (`download-lib`, see .cargo/config.toml) stages
          # it in the target profile directory. If it is not there, search the download cache.
          # UNVERIFIED: the staging location and file names come from the libduckdb-sys build script, not
          # from a run of this workflow. The step fails if nothing is found, so a wrong guess shows up as a
          # failed release rather than a broken archive.
          case "$RUNNER_OS" in
            Linux)   patterns=('libduckdb.so*') ;;
            macOS)   patterns=('libduckdb*.dylib') ;;
            Windows) patterns=('duckdb.dll') ;;
          esac
          copied=0
          for pattern in "${patterns[@]}"; do
            hits=$(find "target/${TARGET}/release" -maxdepth 1 -name "$pattern" || true)
            if [ -z "$hits" ]; then
              hits=$(find target -path '*duckdb-download*' -name "$pattern" || true)
            fi
            while IFS= read -r lib; do
              [ -n "$lib" ] || continue
              cp -L "$lib" "$out/"    # -L: copy the file a symlink points to
              copied=$((copied + 1))
            done <<< "$hits"
          done
          if [ "$copied" -eq 0 ]; then
            echo "::error::DuckDB shared library not found for $TARGET"
            exit 1
          fi

          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "$out/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -rf "$out"
          ls -l dist

      - name: Smoke test the archive in a clean directory
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="dqd-${RELEASE_TAG}-${TARGET}"
          work="${RUNNER_TEMP}/smoke"
          rm -rf "$work" && mkdir -p "$work"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -o"$work" "dist/${name}.zip" > /dev/null
            exe=dqd.exe
          else
            tar -xzf "dist/${name}.tar.gz" -C "$work"
            exe=dqd
          fi
          cd "$work/${name}"
          ls -l
          # How the binary finds DuckDB's library, for the record.
          case "$RUNNER_OS" in
            Linux) readelf -d dqd | grep -i -E 'runpath|rpath|duckdb' || true ;;
            macOS) otool -L dqd | grep -i duckdb || true; otool -l dqd | grep -A2 LC_RPATH || true ;;
          esac
          unset LD_LIBRARY_PATH DYLD_LIBRARY_PATH || true
          "./$exe" --version
          # Run against an empty DuckDB file. It must reach DuckDB and fail on the missing CDM table: that
          # proves the library beside the binary loaded. A missing or unfindable library fails earlier.
          set +e
          out="$("./$exe" run --dbms duckdb --server "$work/smoke.duckdb" --cdm-source-name smoke \
            --cdm-database-schema main --results-database-schema main --cdm-version 5.4 \
            --output-folder "$work/out" 2>&1)"
          set -e
          echo "$out"
          echo "$out" | grep -q "cdm_source" || { echo "::error::the archived binary did not reach DuckDB"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dqd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: checksums and release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # only this job may write to the repository, to create the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.publish_tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum dqd-*.tar.gz dqd-*.zip > SHA256SUMS
      - name: Create the release
        # A manual run without publish_tag is a dry run: everything above ran, but no release is created.
        if: github.ref_type == 'tag' || inputs.publish_tag != ''
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            flags=(--verify-tag)                 # the tag was pushed: use it
          else
            flags=(--target "$GITHUB_SHA")       # create the tag at the commit this run built
          fi
          flags+=(--title "$RELEASE_TAG" --generate-notes)
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" "${flags[@]}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS
