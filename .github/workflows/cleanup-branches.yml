name: Cleanup branches (one-off)

# One-off: delete merged feature branches. Removed again straight after it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete branches that have nothing master lacks
        run: |
          set -euo pipefail
          for branch in dqd/citation-badges dqd/production-ready dqd/rusqlite-upgrade dqd/test-data-docs; do
            if ! ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${branch}" --jq .ahead_by 2>/dev/null); then
              echo "$branch: not found, nothing to do"
              continue
            fi
            if [ "$ahead" != "0" ]; then
              echo "::error::$branch has $ahead commits that master lacks: not deleting it"
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "deleted $branch"
          done
