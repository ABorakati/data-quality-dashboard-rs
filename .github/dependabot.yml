version: 2
updates:
  # Covers the workspace (root crate, crates/db, crates/sqlrender) from the root Cargo.lock.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # crates/sqlrender/fuzz is excluded from the workspace and has its own lock file.
  - package-ecosystem: cargo
    directory: "/crates/sqlrender/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
