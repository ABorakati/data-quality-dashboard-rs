version: 2
updates:
  # Covers the workspace (root crate, crates/db, crates/sqlrender) from the root Cargo.lock.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # rusqlite and duckdb are pinned exactly: the SQLite and DuckDB engine versions can change results, so
    # upgrade them by hand and run the full parity suite (see CHANGELOG.md for the last rusqlite upgrade).
    ignore:
      - dependency-name: rusqlite
      - dependency-name: duckdb
      - dependency-name: libduckdb-sys

  # crates/sqlrender/fuzz is excluded from the workspace and has its own lock file.
  - package-ecosystem: cargo
    directory: "/crates/sqlrender/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The tags of dtolnay/rust-toolchain are Rust versions, not releases: `@1.97` in the MSRV job is the declared
    # minimum supported Rust version, and `@stable` is a branch. Change them by hand.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
