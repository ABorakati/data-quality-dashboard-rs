[workspace]
members = [".", "crates/sqlrender", "crates/db"]
exclude = ["crates/sqlrender/fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ABorakati/data-quality-dashboard-rs"
rust-version = "1.97"

[package]
name = "data-quality-dashboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust port of OHDSI DataQualityDashboard 2.9.0 that produces identical check results to the R package (SQLite, DuckDB, PostgreSQL)"
readme = "README.md"
keywords = ["omop", "ohdsi", "data-quality", "dashboard", "healthcare"]
categories = ["command-line-utilities", "database", "science"]
# The test suite compares against R-generated fixtures (239 MB, over crates.io's 10 MB limit), so
# the tests, the oracle scripts and the fuzz harness stay in the repository only.
exclude = ["/tests", "/scripts", "/fuzz", "/examples/fuzz_differential.rs", "/.cargo"]

[lib]
name = "data_quality_dashboard"
path = "src/lib.rs"

[[bin]]
name = "dqd"
path = "src/main.rs"

[features]
default = ["duckdb", "tls"]
# DuckDB support; links DuckDB's prebuilt shared library. Turn it off for a SQLite and PostgreSQL build.
duckdb = ["dqd-db/duckdb"]
# PostgreSQL TLS (rustls, pure Rust). Without it `sslmode=require` and stronger are rejected.
tls = ["dqd-db/tls"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
dqd-sqlrender = { path = "crates/sqlrender", version = "0.1.0" }
dqd-db = { path = "crates/db", version = "0.1.0", default-features = false }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
